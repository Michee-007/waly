[package]
name = "waly-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
chrono.workspace = true
ort.workspace = true
tokenizers.workspace = true
# Types du protocole IPC du service scelleur (R6a). Le module ipc est pur
# (aucune dep Windows) ; wfp/service sont cfg(windows) et n'alourdissent pas
# le graphe cote client.
waly-seal = { path = "../waly-seal" }
# Documents Office (docx/xlsx/pptx = ZIP de XML) : ecrivain ZIP maison
# (zipw.rs). Deja dans le graphe du workspace ; backend Rust PUR
# (miniz_oxide), rien de natif a compiler (piege 3).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
# Partage entre deux Waly (lot 3) : chiffrement authentifie a cle publique
# « crypto_box » de NaCl (X25519 + XSalsa20-Poly1305), en Rust pur — une
# construction standard, rien d'invente ; alea du systeme (getrandom).
crypto_box = { version = "0.9", features = ["std", "getrandom"] }

# Windows uniquement : elever le scelle d'un agent TIERS (ShellExecuteExW
# runas -> UAC, chantier C) et le selecteur de fichier natif (GetOpenFileNameW,
# comdlg32 = DLL systeme -> SAC-safe). Rien de natif a compiler (piege 3).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    # Coffre de cles des modeles exterieurs (DPAPI, crypt32 = DLL systeme).
    "Win32_Security_Cryptography",
] }
